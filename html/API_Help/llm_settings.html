<div class="container">
<div class="lang-buttons">

<button class="lang-btn" onclick="changeLanguage('ja')">日本語</button>
<button class="lang-btn" onclick="changeLanguage('ko')">한국어</button>
<button class="lang-btn" onclick="changeLanguage('zh')">中文</button>
<button class="lang-btn" onclick="changeLanguage('fr')">Français</button>
</div>

<h1 data-i18n="title">LLM Setup Guide</h1>
<p data-i18n="intro"></p>

<div class="tab-menu">
<button class="tab-btn active" onclick="openTab(event,'grok')">Grok (xAI)</button>
<button class="tab-btn" onclick="openTab(event,'ollama')">Ollama</button>
<button class="tab-btn" onclick="openTab(event,'usage')" data-i18n="tab_usage">Usage</button>
</div>

<div id="grok" class="tab-content active">
<div class="card">
<h2 data-i18n="grok_step_key"></h2>
<p data-i18n="grok_key_desc"></p>
<code>https://console.x.ai</code>
<p class="notice" data-i18n="grok_key_notice"></p>
</div>
<div class="card">
<h2 data-i18n="grok_step_config"></h2>
<p data-i18n="grok_config_desc"></p>
<p data-i18n="grok_config_models"></p>
<p class="notice" data-i18n="grok_cors_ok"></p>
</div>
</div>

<div id="ollama" class="tab-content">
<div class="card">
<h2 data-i18n="ollama_step_install"></h2>
<p data-i18n="ollama_install_desc"></p>
<code>https://ollama.com/download</code>
<h3 data-i18n="ollama_step_pull"></h3>
<p data-i18n="ollama_pull_desc"></p>
<code>ollama pull qwen2.5:7b</code>
<p data-i18n="ollama_pull_vision_desc"></p>
<code>ollama pull llava</code>
</div>

<div class="card">
<h2 data-i18n="ollama_step_cors"></h2>
<p class="notice" data-i18n="ollama_cors_reason"></p>
<p data-i18n="ollama_cors_symptom"></p>
<h3 data-i18n="ollama_cors_windows"></h3>
<p data-i18n="ollama_cors_windows_desc"></p>
<code>setx OLLAMA_ORIGINS "*"</code>
<h3 data-i18n="ollama_cors_mac"></h3>
<p data-i18n="ollama_cors_mac_desc"></p>
<code>launchctl setenv OLLAMA_ORIGINS "*"</code>
<h3 data-i18n="ollama_cors_linux"></h3>
<p data-i18n="ollama_cors_linux_desc"></p>
<code>systemctl edit ollama.service</code>
<code>[Service]
Environment="OLLAMA_ORIGINS=*"</code>
<p class="notice" data-i18n="ollama_cors_restart"></p>
<p data-i18n="ollama_cors_null_note"></p>
<code>OLLAMA_ORIGINS=null</code>
</div>

<div class="card">
<h2 data-i18n="ollama_step_verify"></h2>
<p data-i18n="ollama_verify_desc"></p>
<code>http://127.0.0.1:11434</code>
<p data-i18n="ollama_verify_models"></p>
</div>
</div>

<div id="usage" class="tab-content">
<div class="card">
<h2 data-i18n="usage_roles"></h2>
<p data-i18n="usage_roles_desc"></p>
<h3 data-i18n="usage_role_t2p"></h3>
<p data-i18n="usage_role_t2p_desc"></p>
<h3 data-i18n="usage_role_i2p"></h3>
<p data-i18n="usage_role_i2p_desc"></p>
<h3 data-i18n="usage_role_t2t"></h3>
<p data-i18n="usage_role_t2t_desc"></p>
</div>
<div class="card">
<h2 data-i18n="usage_model_choice"></h2>
<p data-i18n="usage_model_choice_desc"></p>

</div>
</div>
</div>

function openTab(evt, tabName) {
document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
document.getElementById(tabName).classList.add('active');
evt.currentTarget.classList.add('active');
}

function openTabByHash() {
const name = window.location.hash.replace('#', '');
if (!name) return;
const target = document.getElementById(name);
if (!target) return;
document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
target.classList.add('active');
const index = ['grok', 'ollama', 'usage'].indexOf(name);
const buttons = document.querySelectorAll('.tab-btn');
if (index >= 0 && buttons[index]) buttons[index].classList.add('active');
}

i18next.init({
lng: 'en',
resources: resources
}, function(err, t) {
updateContent();
openTabByHash();
});

window.addEventListener('hashchange', openTabByHash);

function updateContent() {
document.title = i18next.t('title');
document.querySelectorAll('[data-i18n]').forEach(function(elem) {
elem.textContent = i18next.t(elem.getAttribute('data-i18n'));
});
}

function changeLanguage(lng) {
document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
i18next.changeLanguage(lng, function(err, t) {
updateContent();
});
}
</script>
