<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n>V3 画像生成</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="common/nav.css">
<link rel="stylesheet" href="common/keys.css">
<script src="vendor/fabric-7.4.0/fabric.min.js"></script>
<script src="vendor/lucide-0.468.0/lucide.min.js"></script>
</head>
<body>
<div id="app">
  <header class="top" data-v3-panel>
    <div class="brand"><span class="mark"><i data-lucide="sparkles"></i></span><span data-i18n>画像生成</span></div>
    <nav class="pickers" aria-label="作品・ページ・コマ" data-i18n-attr="aria-label">
      <select id="pick-work" class="field" aria-label="作品" data-i18n-attr="aria-label"></select>
      <span class="slash">/</span>
      <select id="pick-page" class="field" aria-label="ページ" data-i18n-attr="aria-label"></select>
      <span class="slash">/</span>
      <select id="pick-panel" class="field" aria-label="コマ" data-i18n-attr="aria-label"></select>
    </nav>
    <a class="btn sm" id="to-manuscript" href="manuscript/index.html" title="このページを原稿の画面で開く" data-i18n-attr="title"><i data-lucide="book-open"></i><span data-i18n>原稿の画面</span></a>
    <label class="who" id="who-dev"><span data-i18n>利用者（開発用）</span> <input id="user" class="field" autocomplete="username"></label>
    <span class="who" id="who-login" hidden><span id="who-name"></span> <a href="/auth/logout" data-i18n>ログアウト</a></span>
  </header>
  <nav class="v3-nav" data-v3-nav="workbench" data-v3-panel></nav>

  <div class="ws">
    <section class="canvas" aria-label="コマの絵" data-i18n-attr="aria-label">
      <div class="stage-host" id="stage"></div>
      <div class="empty" id="stage-empty" hidden></div>

      <div class="ftb" role="toolbar" aria-label="ツール" data-i18n-attr="aria-label">
        <button class="tool" data-tool="select" aria-pressed="true" data-key="workbench.select" title="動かす・見る" data-i18n-attr="title"><i data-lucide="hand"></i><span data-i18n>見る</span><kbd></kbd></button>
        <button class="tool" data-tool="mask" aria-pressed="false" data-key="workbench.mask" title="囲んで頼む" data-i18n-attr="title"><i data-lucide="lasso-select"></i><span data-i18n>囲んで頼む</span><kbd></kbd></button>
        <button class="tool" data-tool="extend" aria-pressed="false" data-key="workbench.extend" title="描き足す" data-i18n-attr="title"><i data-lucide="expand"></i><span data-i18n>描き足す</span><kbd></kbd></button>
        <span class="vsep"></span>
        <button class="tool" data-tool="pen" aria-pressed="false" data-key="workbench.pen" title="ペン" data-i18n-attr="title"><i data-lucide="pen-line"></i><span data-i18n>ペン</span><kbd></kbd></button>
        <button class="tool" data-tool="erase" aria-pressed="false" data-key="workbench.erase" title="消しゴム" data-i18n-attr="title"><i data-lucide="eraser"></i><span data-i18n>消しゴム</span><kbd></kbd></button>
        <span class="vsep"></span>
        <button class="tool" id="undo" aria-disabled="true" data-key="edit.undo" title="取り消す" data-i18n-attr="title"><i data-lucide="undo-2"></i><span data-i18n>取り消す</span></button>
        <button class="tool" id="redo" aria-disabled="true" data-key="edit.redo" title="やり直す" data-i18n-attr="title"><i data-lucide="redo-2"></i><span data-i18n>やり直す</span></button>
        <button class="tool" id="keys-open" data-key="view.help" title="キーの一覧" data-i18n-attr="title"><i data-lucide="keyboard"></i><span data-i18n>キー</span><kbd></kbd></button>
      </div>

      <div class="ftb sub" id="mask-bar" role="toolbar" aria-label="囲むツール" data-i18n-attr="aria-label" hidden>
        <div class="seg" id="mask-tools">
          <button data-mask="brush" aria-pressed="true"><i data-lucide="brush"></i><span data-i18n>筆</span></button>
          <button data-mask="eraser" aria-pressed="false"><i data-lucide="eraser"></i><span data-i18n>消しゴム</span></button>
          <button data-mask="lasso" aria-pressed="false"><i data-lucide="lasso"></i><span data-i18n>投げ縄</span></button>
          <button data-mask="polygon" aria-pressed="false"><i data-lucide="pentagon"></i><span data-i18n>多角形</span></button>
          <button data-mask="rect" aria-pressed="false"><i data-lucide="square-dashed"></i><span data-i18n>四角</span></button>
        </div>
        <label class="row meta"><span data-i18n>太さ</span> <input id="brush-size" type="range" min="2" max="200" value="24"><span id="brush-size-v" class="num">24</span></label>
        <span class="vsep"></span>
        <button class="ibtn" id="mask-invert" title="囲みを反転する" aria-label="囲みを反転する" data-i18n-attr="title aria-label"><i data-lucide="flip-horizontal-2"></i></button>
        <button class="ibtn" id="mask-fill" title="全部を囲む" aria-label="全部を囲む" data-i18n-attr="title aria-label"><i data-lucide="paint-bucket"></i></button>
        <button class="ibtn" id="mask-clear" title="囲みを全部消す" aria-label="囲みを全部消す" data-i18n-attr="title aria-label"><i data-lucide="trash-2"></i></button>
        <button class="ibtn" id="mask-show" aria-pressed="true" title="囲みを見せる・隠す" aria-label="囲みを見せる・隠す" data-i18n-attr="title aria-label"><i data-lucide="eye"></i></button>
      </div>

      <div class="ftb sub" id="pen-bar" role="toolbar" aria-label="ペン" data-i18n-attr="aria-label" hidden>
        <span class="meta" data-i18n>太さ</span>
        <div class="seg" id="pen-width">
          <button data-w="0.3" aria-pressed="false">0.3mm</button>
          <button data-w="0.6" aria-pressed="true">0.6mm</button>
          <button data-w="1.2" aria-pressed="false">1.2mm</button>
        </div>
        <span class="meta" id="pen-note"></span>
      </div>

      <div class="ftb sub" id="erase-bar" role="toolbar" aria-label="消しゴム" data-i18n-attr="aria-label" hidden>
        <label class="row meta"><span data-i18n>太さ</span> <input id="erase-size" type="range" min="2" max="200" value="16"><span id="erase-size-v" class="num">16</span>px</label>
        <span class="meta" data-i18n>コマの絵のピクセルを消します。消した所は手動編集の範囲になります</span>
      </div>

      <div class="viewing" id="viewing" hidden>
        <i data-lucide="history"></i><span id="viewing-text"></span>
        <button class="btn sm" id="viewing-back" data-i18n>今の絵に戻る</button>
      </div>

      <div class="stage-msg" id="stage-msg"></div>

      <div class="zoom">
        <button class="ibtn" id="zoom-out" data-key="workbench.zoomOut" title="縮める" data-i18n-attr="title"><i data-lucide="minus"></i></button>
        <button class="ibtn" id="zoom-fit" data-key="workbench.zoomFit" title="合わせる" data-i18n-attr="title"><i data-lucide="scan"></i></button>
        <button class="ibtn" id="zoom-in" data-key="workbench.zoomIn" title="広げる" data-i18n-attr="title"><i data-lucide="plus"></i></button>
      </div>

      <div class="compare" id="compare" hidden>
        <div class="compare-h">
          <span class="h2 grow" id="compare-title" data-i18n>比べる</span>
          <div class="seg" id="compare-mode">
            <button data-mode="side" aria-pressed="true"><i data-lucide="columns-2"></i><span data-i18n>並べる</span></button>
            <button data-mode="slider" aria-pressed="false"><i data-lucide="split"></i><span data-i18n>重ねて動かす</span></button>
          </div>
          <button class="btn sm" id="compare-close"><i data-lucide="x"></i><span data-i18n>閉じる</span></button>
        </div>
        <div class="compare-b" id="compare-body"></div>
      </div>
    </section>

    <aside class="insp" aria-label="頼む・候補・版" data-i18n-attr="aria-label" data-v3-strip>
      <div class="itabs" role="tablist">
        <button class="itab" role="tab" data-tab="ask" aria-selected="true"><i data-lucide="wand-sparkles"></i><span data-i18n>頼む</span></button>
        <button class="itab" role="tab" data-tab="cands" aria-selected="false"><i data-lucide="layout-grid"></i><span data-i18n>候補</span><span class="count" id="cand-count"></span></button>
        <button class="itab" role="tab" data-tab="versions" aria-selected="false"><i data-lucide="history"></i><span data-i18n>版</span></button>
      </div>

      <div class="insp-b" data-pane="ask">
        <div class="sec">
          <div class="sec-h"><span class="lbl" data-i18n>頼むこと</span></div>
          <div class="chips" id="process-list"></div>
          <div class="meta" id="process-hint"></div>
        </div>
        <div class="sec" id="input-notes"></div>
        <div class="sec" id="form"></div>
      </div>
      <div class="insp-f" data-pane="ask">
        <div class="kv">
          <span class="k" data-i18n>接続先</span><div class="v"><select class="field" id="service"></select></div>
          <span class="k" data-i18n>枚数</span>
          <div class="v"><div class="seg" id="count">
            <button data-n="1" aria-pressed="false">1</button><button data-n="2" aria-pressed="false">2</button>
            <button data-n="4" aria-pressed="true">4</button><button data-n="6" aria-pressed="false">6</button>
          </div></div>
          <span class="k" data-i18n>種（seed）</span>
          <div class="v"><div class="seg" id="seed-mode">
            <button data-m="random" aria-pressed="true" data-i18n>乱数</button><button data-m="fixed" aria-pressed="false" data-i18n>固定</button>
          </div><input class="field num" id="seed" type="number" min="0" step="1" value="0" hidden></div>
        </div>
        <div class="meta" id="service-meta"></div>
        <button class="btn ai block" id="generate" data-key="workbench.generate" title="頼む" data-i18n-attr="title"><i data-lucide="sparkles"></i><span data-i18n>頼む</span><kbd></kbd></button>
        <div id="progress" class="sec"></div>
      </div>

      <div class="insp-b" data-pane="cands" hidden>
        <div class="note" id="cand-help"><i data-lucide="info"></i><span data-i18n>小さい絵を押すと選べます。2枚まで選んで「比べる」。1枚なら今の絵と比べます。橙の所は手動編集の範囲で、元のピクセルのまま残しています。</span></div>
        <div id="sets" class="sec"></div>
      </div>

      <div class="insp-b" data-pane="versions" hidden>
        <div class="note"><i data-lucide="info"></i><span data-i18n>このコマに置いたことのある絵です。「見る」で画面に出し、「戻す」でコマの絵をその版にします（取り消せます）。</span></div>
        <div id="versions" class="vtree"></div>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="v3-lum-to-alpha"><feColorMatrix type="luminanceToAlpha"/></filter></svg>
<script type="module" src="common/nav.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
