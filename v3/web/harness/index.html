<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIハーネス</title>
<link rel="stylesheet" href="../common/theme.css">
<link rel="stylesheet" href="../common/nav.css">
<link rel="stylesheet" href="../common/keys.css">
<link rel="stylesheet" href="./harness.css">
<!-- 印の絵（キーの一覧・帯のボタン）と図の部品（v3/web/vendor に置いた版。外から取りに行かない） -->
<script src="../vendor/lucide-0.468.0/lucide.min.js"></script>
<script src="../vendor/cytoscape-3.34.3/cytoscape.min.js"></script>
<script src="../vendor/elkjs-0.11.1/elk.bundled.js"></script>
<script type="module" src="../common/nav.js"></script>
<script type="module" src="./harness.js"></script>
</head>
<body data-view="stage">
<header class="top" data-v3-panel>
  <div class="brand"><span class="label">V3 / HARNESS</span><h1>AIハーネス</h1><span id="work-title" class="work"></span></div>
  <div class="tabs" role="tablist">
    <button id="tab-stage" type="button" class="tab on" data-key="harness.stageView" title="工程の図">工程の図</button>
    <button id="tab-unit" type="button" class="tab" disabled>作業の図</button>
  </div>
  <div class="right">
    <span id="conn" class="conn conn-connecting">つないでいます</span>
    <form id="user-form" class="user"><span class="label">利用者</span><input id="user" type="text" size="10" autocomplete="off"></form>
  </div>
</header>
<nav class="v3-nav" data-v3-nav="harness" data-v3-panel></nav>
<p id="empty" class="empty" hidden></p>
<main class="layout">
  <section class="graph-box">
    <div class="graph-head"><span class="label">図</span><span class="legend">
      <span><i class="lg st-running"></i>実行中</span> <span><i class="lg st-waiting"></i>送り先を待つ</span> <span><i class="lg st-review"></i>人の判断待ち</span>
      <span><i class="lg st-blocked"></i>止まった・決めるまで進めない</span> <span><i class="lg st-paused"></i>止めた</span> <span><i class="lg stale"></i>上流が変わった</span></span>
      <button id="fold" type="button" class="btn small" title="工程の図で、作業をページごとにたたむ（まとまりを押しても開く・たたむ）">ページごとにたたむ</button>
      <button id="unfold" type="button" class="btn small" title="たたんだまとまりを全部開く">全部開く</button>
      <button id="fit" type="button" class="btn small" data-key="harness.fit" title="全体を見る">全体を見る<kbd></kbd></button></div>
    <div class="graph-wrap">
      <div id="graph" class="graph"></div>
      <div id="graph-overlay" class="graph-overlay"></div>
      <div class="disconnected-veil"><span>切断中：受け取れていません。つなぎ直したら今の状態を取り直します</span></div>
    </div>
    <p id="graph-note" class="graph-note muted" aria-live="polite"></p>
    <div id="gen-progress" class="gen-box" hidden></div>
    <div class="timeline-box">
      <div class="graph-head"><span class="label">時間の列</span><span id="timeline-span" class="muted"></span></div>
      <div id="timeline" class="timeline"></div>
    </div>
  </section>
  <aside id="side" class="side" data-v3-panel></aside>
  <section class="table-box" data-v3-panel>
    <div class="graph-head"><span class="label">ページとコマ</span><span class="muted">押すと作業の図を開きます</span></div>
    <table class="pages"><thead><tr><th>ページ</th><th>コマ</th><th>まとめ</th></tr></thead><tbody id="table-body"></tbody></table>
  </section>
</main>
<div id="toast" class="toast"></div>
</body>
</html>
