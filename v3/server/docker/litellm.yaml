# つなぎ先（文章・VLM）はここに足す。モデル名とキーは利用者の契約で決まるので、ここには置かない。
# 例の書き方は llm_doc/V3サーバーの土台.md の「LLMのつなぎ先を足す」にある。
model_list: []

router_settings:
