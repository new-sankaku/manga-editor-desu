[project]
name = "v3server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "boto3>=1.43.109",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "img2pdf>=0.6.3",
    "itsdangerous>=2.2.0",
    "kiwisolver>=1.5.1",
    "lz4>=4.4.5",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "psd-tools>=1.21.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "shapely>=2.1",
    "sqlalchemy[asyncio]>=2",
    "temporalio>=1.34.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.109",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/v3server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "full: 重い共有の処理（描画・PSD・組版・Temporal）を通す試験。速い組（fast）からは外す",
    "perf: 時間を測る試験（大きな絵を使う）。別に流す",
]

# lint と型の検査（.github/workflows/v3-server.yml でも流す。V3サーバーの土台 1.7）
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# 既定（E4・E7・E9・F）に、import の並び（I）・よくある誤り（B）・新しい書き方（UP）・時差の無い時刻（DTZ）を足す
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "DTZ"]
# 型引数の書き方（def f[T]）は今のままにする
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
# 試験は fixture を import して引数の名前で受ける（F811）。conftest は環境変数を決めてから import する（E402）。
# 試験の中の短い名前・lambda・使わない周回の変数は許す
"tests/**" = ["F811", "E402", "E741", "E731", "B007"]
# 内側の関数は同じ周回の中でだけ呼ぶ（V3点検/5 0節。誤検出）
"src/v3server/panel_layout/panel_geometry.py" = ["B023"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["v3server"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
