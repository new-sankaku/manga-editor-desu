# Keycloak 26.8.0（試作用。start-dev＝内蔵DB。本番は PostgreSQL を付ける）
name: p54
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: p54-admin-throwaway
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://127.0.0.1:61080
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:61080:8080", "127.0.0.1:61081:9000"]
    volumes: ["./realm.json:/opt/keycloak/data/import/realm.json:ro"]
