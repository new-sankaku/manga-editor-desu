<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>案2: 2段タブ型（GPU横タブ + カテゴリ別サブタブ）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#212121;color:#dedede;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;}

.us-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;}
.us-window{background:#212121;border:1px solid rgba(255,255,255,0.1);border-radius:8px;width:75vw;height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.6);overflow:hidden;}
.us-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #505050;flex-shrink:0;}
.us-header h2{font-size:14px;font-weight:bold;color:#ff7c7c;}
.us-close{background:none;border:none;font-size:18px;color:#888;cursor:pointer;padding:2px 6px;border-radius:4px;}

/* --- 1st level tabs: GPU --- */
.gpu-tabs{display:flex;border-bottom:1px solid #505050;background:rgba(255,255,255,0.02);flex-shrink:0;padding:0 8px;}
.gpu-tab{padding:10px 20px;font-size:12px;color:#888;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all 0.15s;display:flex;align-items:center;gap:8px;}
.gpu-tab:hover{color:#dedede;background:rgba(255,255,255,0.04);}
.gpu-tab.active{color:#ff7c7c;border-bottom-color:#810000;background:rgba(129,0,0,0.1);}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.status-dot.online{background:#4caf50;box-shadow:0 0 4px rgba(76,175,80,0.4);}
.status-dot.offline{background:#666;}
.status-dot.error{background:#f44336;}

/* --- 2nd level tabs: Category --- */
.cat-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.01);flex-shrink:0;padding:0 16px;}
.cat-tab{padding:8px 16px;font-size:11px;color:#666;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all 0.15s;}
.cat-tab:hover{color:#aaa;}
.cat-tab.active{color:#dedede;border-bottom-color:#505050;}

/* --- content area --- */
.tab-body{flex:1;overflow-y:auto;padding:20px 24px;}

/* --- form --- */
.form-group{margin-bottom:20px;}
.form-group-title{font-size:11px;font-weight:600;color:#ff7c7c;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.06);}
.form-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.form-label{font-size:11px;color:#888;min-width:130px;flex-shrink:0;}
.form-input{font-size:11px;padding:5px 10px;border:1px solid #505050;border-radius:4px;background:#333;color:#dedede;flex:1;min-width:0;}
.form-select{font-size:11px;padding:5px 10px;border:1px solid #505050;border-radius:4px;background:#333;color:#dedede;flex:1;min-width:0;}
.form-btn{font-size:11px;padding:4px 10px;border:1px solid #505050;border-radius:4px;background:#505050;color:#dedede;cursor:pointer;white-space:nowrap;}
.form-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
.form-slider-wrap{flex:1;display:flex;align-items:center;gap:8px;}
.form-slider{flex:1;accent-color:#810000;height:4px;}
.form-slider-val{font-size:11px;color:#888;min-width:30px;text-align:right;}

/* --- role matrix tab --- */
.role-tab-special{color:#ff7c7c !important;font-style:italic;}
.role-matrix{width:100%;border-collapse:collapse;max-width:700px;}
.role-matrix th{font-size:10px;color:#888;font-weight:600;padding:6px 8px;text-align:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);}
.role-matrix th:first-child{text-align:left;}
.role-matrix td{padding:6px 8px;border:1px solid rgba(255,255,255,0.08);text-align:center;font-size:11px;}
.role-matrix td:first-child{text-align:left;color:#dedede;}
.role-matrix input[type="radio"]{accent-color:#810000;}
.role-matrix .unavailable{color:#444;font-size:10px;}

/* --- scrollbar --- */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:#212121;}
::-webkit-scrollbar-thumb{background:#480000;border-radius:3px;}
</style>
</head>
<body>
<div class="us-overlay">
<div class="us-window">
<div class="us-header">
  <h2>&#9881; 生成AI設定</h2>
  <button class="us-close">&times;</button>
</div>

<!-- 1st Level: GPU Tabs -->
<div class="gpu-tabs">
  <div class="gpu-tab active"><span class="status-dot online"></span>ComfyUI (Local)</div>
  <div class="gpu-tab"><span class="status-dot offline"></span>RunPod ComfyUI</div>
  <div class="gpu-tab"><span class="status-dot error"></span>SD WebUI (A1111)</div>
  <div class="gpu-tab"><span class="status-dot online"></span>Fal.ai</div>
  <div class="gpu-tab role-tab-special">&#128279; ロール</div>
</div>

<!-- 2nd Level: Category Sub-Tabs -->
<div class="cat-tabs">
  <div class="cat-tab active">接続</div>
  <div class="cat-tab">LLM Vision</div>
  <div class="cat-tab">AIモデル</div>
  <div class="cat-tab">設定値</div>
</div>

<!-- Content: Showing "接続" tab for ComfyUI -->
<div class="tab-body">
  <div class="form-group">
    <div class="form-group-title">ComfyUI (Local) &mdash; 接続</div>
    <div class="form-row">
      <span class="form-label">URL</span>
      <input type="text" class="form-input" value="http://127.0.0.1:8188">
      <button class="form-btn">初期値</button>
      <button class="form-btn">?</button>
    </div>
    <div class="form-row">
      <span class="form-label">ステータス</span>
      <span style="color:#4caf50;font-size:11px;">&#9679; 接続中 &mdash; ComfyUI v0.2.4</span>
    </div>
  </div>
</div>
</div>
</div>

<!-- === Showing "ロール" tab state below === -->
<div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a2a2a;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:16px 24px;max-width:750px;width:90%;box-shadow:0 4px 16px rgba(0,0,0,0.4);">
  <div style="font-size:11px;color:#ff7c7c;font-weight:600;margin-bottom:10px;">「ロール」タブ選択時の表示例</div>
  <table class="role-matrix" style="width:100%;">
    <thead>
      <tr>
        <th style="text-align:left">ロール</th>
        <th>ComfyUI (Local)</th>
        <th>RunPod ComfyUI</th>
        <th>SD WebUI</th>
        <th>Fal.ai</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Text2Image</td><td><input type="radio" name="d_t2i" checked></td><td><input type="radio" name="d_t2i"></td><td><input type="radio" name="d_t2i"></td><td><input type="radio" name="d_t2i"></td></tr>
      <tr><td>Image2Image</td><td><input type="radio" name="d_i2i" checked></td><td><input type="radio" name="d_i2i"></td><td><input type="radio" name="d_i2i"></td><td><input type="radio" name="d_i2i"></td></tr>
      <tr><td>Inpaint</td><td><input type="radio" name="d_inp" checked></td><td><input type="radio" name="d_inp"></td><td><span class="unavailable">&mdash;</span></td><td><span class="unavailable">&mdash;</span></td></tr>
      <tr><td>Upscaler</td><td><input type="radio" name="d_up"></td><td><input type="radio" name="d_up"></td><td><span class="unavailable">&mdash;</span></td><td><input type="radio" name="d_up" checked></td></tr>
      <tr><td>RemoveBG</td><td><input type="radio" name="d_bg"></td><td><input type="radio" name="d_bg"></td><td><input type="radio" name="d_bg"></td><td><input type="radio" name="d_bg" checked></td></tr>
      <tr><td>Angle</td><td><input type="radio" name="d_ang" checked></td><td><input type="radio" name="d_ang"></td><td><span class="unavailable">&mdash;</span></td><td><span class="unavailable">&mdash;</span></td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
