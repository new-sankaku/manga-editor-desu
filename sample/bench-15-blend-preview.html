<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Bench 15 — ブレンドモードプレビュー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',sans-serif;padding:24px;min-height:100vh}
h1{font-size:20px;margin-bottom:6px;color:#4af}
.subtitle{font-size:13px;color:#888;margin-bottom:20px}
.card{background:#16213e;border:1px solid #1a2a50;border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;color:#adf;margin-bottom:10px}
button{
  background:#2a4a8a;color:#e0e0e0;border:none;border-radius:5px;
  padding:10px 22px;font-size:14px;cursor:pointer;transition:background .2s;
}
button:hover{background:#3a5aaa}
button:disabled{background:#333;color:#666;cursor:not-allowed}
.progress{margin-top:12px;font-size:13px;color:#aaa;min-height:18px}
.progress-bar-wrap{background:#0d1526;border-radius:4px;height:8px;margin-top:6px;overflow:hidden}
.progress-bar{height:100%;background:#4af;width:0%;transition:width .15s}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
th{background:#0d1526;padding:8px 10px;text-align:left;color:#8bf;border-bottom:2px solid #1a2a50}
td{padding:7px 10px;border-bottom:1px solid #1a2a50;vertical-align:middle}
tr:last-child td{border-bottom:none}
.tag-best{display:inline-block;background:#1a4a1a;color:#4f4;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px}
.tag-worst{display:inline-block;background:#4a1a1a;color:#f44;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px}
.speedup{color:#fd4;font-weight:bold}
.note{font-size:12px;color:#888;margin-top:8px}
.warn{color:#fa4;font-size:12px;margin-top:8px}
.verify{font-size:12px;color:#8f8;margin-top:4px}
</style>
</head>
<body>
<h1>Bench 15 — ブレンドモードプレビュー</h1>
<p class="subtitle">25種類のブレンドモードを一括適用するCanvas2D実装の速度比較</p>

<div class="card">
  <h2>テスト設定</h2>
  <p style="font-size:13px;color:#aaa">画像サイズ: 512×512 &nbsp;|&nbsp; ブレンドモード: 25種類 &nbsp;|&nbsp; 繰り返し: 20回</p>
  <p class="note">※ 改善案Aはキャンバスを使い回し（毎回createElement不要）、改善案BはOffscreenCanvas利用</p>
  <p class="warn">※ 改善案B (OffscreenCanvas) はブラウザが未対応の場合はエラー表示されます</p>
  <div style="margin-top:12px">
    <button id="btnRun">ベンチマーク開始</button>
  </div>
  <div class="progress" id="progress">待機中...</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="pbar"></div></div>
</div>

<div class="card" id="resultCard">
  <h2>結果</h2>
  <div class="verify" id="verifyMsg"></div>
  <table id="resultTable">
    <thead>
      <tr>
        <th>手法</th>
        <th>最小 (ms)</th>
        <th>最大 (ms)</th>
        <th>平均 (ms)</th>
        <th>現行比 改善率</th>
        <th>ステータス</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<script>
'use strict';

const IMG_W = 512, IMG_H = 512;
const REPEAT = 20;
const BLEND_MODES = [
  'multiply','screen','overlay','darken','lighten',
  'color-dodge','color-burn','hard-light','soft-light','difference',
  'exclusion','hue','saturation','color','luminosity',
  'source-over','source-in','source-out','source-atop',
  'destination-over','destination-in','destination-out','destination-atop',
  'lighter','xor'
];

function setProgress(msg, pct) {
  document.getElementById('progress').textContent = msg;
  document.getElementById('pbar').style.width = pct + '%';
}

// テスト用画像生成
function createTestImage(style1, style2) {
  const c = document.createElement('canvas');
  c.width = IMG_W; c.height = IMG_H;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, IMG_W, IMG_H);
  g.addColorStop(0, style1);
  g.addColorStop(1, style2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, IMG_W, IMG_H);
  // 円を追加
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(IMG_W/2, IMG_H/2, IMG_W/3, 0, Math.PI*2);
  ctx.fill();
  return c;
}

// 現行実装: 毎回Canvasを生成→描画→破棄
function implLegacy(baseImg, blendImg) {
  var results = [];
  var blendModes = BLEND_MODES;
  for (var i = 0; i < blendModes.length; i++) {
    var c = document.createElement('canvas');
    c.width = IMG_W; c.height = IMG_H;
    var ctx = c.getContext('2d');
    ctx.drawImage(baseImg, 0, 0);
    ctx.globalCompositeOperation = blendModes[i];
    ctx.drawImage(blendImg, 0, 0);
    results.push(c.toDataURL());
  }
  return results;
}

// 改善案A: 1つのCanvasを再利用（clearRect + reset）
function implReuse(baseImg, blendImg) {
  var results = [];
  var blendModes = BLEND_MODES;
  // 1つのCanvasを使い回す
  var c = document.createElement('canvas');
  c.width = IMG_W; c.height = IMG_H;
  var ctx = c.getContext('2d');
  for (var i = 0; i < blendModes.length; i++) {
    ctx.clearRect(0, 0, IMG_W, IMG_H);
    ctx.globalCompositeOperation = 'source-over'; // リセット
    ctx.drawImage(baseImg, 0, 0);
    ctx.globalCompositeOperation = blendModes[i];
    ctx.drawImage(blendImg, 0, 0);
    results.push(c.toDataURL());
  }
  return results;
}

// 改善案B: OffscreenCanvas利用
function implOffscreen(baseImg, blendImg) {
  if (typeof OffscreenCanvas === 'undefined') {
    throw new Error('OffscreenCanvas未対応');
  }
  var results = [];
  var blendModes = BLEND_MODES;
  var c = new OffscreenCanvas(IMG_W, IMG_H);
  var ctx = c.getContext('2d');

  // OffscreenCanvasにbaseImgを事前に描画してImageDataを保持
  var baseCanvas = new OffscreenCanvas(IMG_W, IMG_H);
  var baseCtx = baseCanvas.getContext('2d');
  baseCtx.drawImage(baseImg, 0, 0);
  var baseImageData = baseCtx.getImageData(0, 0, IMG_W, IMG_H);

  for (var i = 0; i < blendModes.length; i++) {
    ctx.clearRect(0, 0, IMG_W, IMG_H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.putImageData(baseImageData, 0, 0); // ImageDataで高速リストア
    ctx.globalCompositeOperation = blendModes[i];
    ctx.drawImage(blendImg, 0, 0);
    // OffscreenCanvasのtoDataURL代替: メインキャンバスへ転送してtoDataURL
    var tmpC = document.createElement('canvas');
    tmpC.width = IMG_W; tmpC.height = IMG_H;
    var tmpCtx = tmpC.getContext('2d');
    tmpCtx.drawImage(c, 0, 0);
    results.push(tmpC.toDataURL());
  }
  return results;
}

async function runBench(name, fn, baseImg, blendImg) {
  const times = [];
  let lastResult;
  for (let r = 0; r < REPEAT; r++) {
    if (r % 5 === 0) {
      setProgress(`${name}: ${r}/${REPEAT}回完了`, 0);
      await new Promise(res => setTimeout(res, 0));
    }
    const t0 = performance.now();
    lastResult = fn(baseImg, blendImg);
    times.push(performance.now() - t0);
    await new Promise(res => setTimeout(res, 0));
  }
  return { times, lastResult };
}

function stats(times) {
  const mn = Math.min(...times);
  const mx = Math.max(...times);
  const avg = times.reduce((a,b)=>a+b,0)/times.length;
  return { min: mn, max: mx, avg };
}

function renderRow(name, s, baseAvg, isBest) {
  const tr = document.createElement('tr');
  const improvement = baseAvg != null
    ? ((baseAvg - s.avg) / baseAvg * 100).toFixed(1)
    : null;
  const improvStr = improvement != null
    ? `<span class="speedup">${improvement > 0 ? '+' : ''}${improvement}%</span>`
    : '<span style="color:#888">—（基準）</span>';
  const badge = isBest ? '<span class="tag-best">BEST</span>' : (improvement !== null && parseFloat(improvement) < 0 ? '<span class="tag-worst">SLOW</span>' : '');
  tr.innerHTML = `
    <td>${name}${badge}</td>
    <td>${s.min.toFixed(2)}</td>
    <td>${s.max.toFixed(2)}</td>
    <td>${s.avg.toFixed(2)}</td>
    <td>${improvStr}</td>
    <td style="color:#4af">完了</td>`;
  document.getElementById('resultBody').appendChild(tr);
}

function renderErrorRow(name, errMsg) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${name}</td><td colspan="4" style="color:#f84">エラー: ${errMsg}</td><td style="color:#f84">スキップ</td>`;
  document.getElementById('resultBody').appendChild(tr);
}

document.getElementById('btnRun').addEventListener('click', async function() {
  this.disabled = true;
  document.getElementById('resultBody').innerHTML = '';
  document.getElementById('verifyMsg').textContent = '';

  setProgress('テスト画像生成中...', 2);
  await new Promise(res => setTimeout(res, 0));
  const baseImg  = createTestImage('#ff6040', '#4060ff');
  const blendImg = createTestImage('#40ff80', '#ff4080');

  setProgress('現行実装 実行中...', 5);
  const { times: timesLeg, lastResult: rLeg } = await runBench('現行実装', implLegacy, baseImg, blendImg);

  setProgress('改善案A (Canvas再利用) 実行中...', 38);
  const { times: timesReu, lastResult: rReu } = await runBench('改善案A', implReuse, baseImg, blendImg);

  let timesOff = null, offErr = null, rOff = null;
  try {
    setProgress('改善案B (OffscreenCanvas) 実行中...', 70);
    const res = await runBench('改善案B', implOffscreen, baseImg, blendImg);
    timesOff = res.times;
    rOff = res.lastResult;
  } catch(e) {
    offErr = e.message;
  }

  setProgress('完了', 100);

  // 結果件数の確認
  const legCount = rLeg ? rLeg.length : 0;
  const reuCount = rReu ? rReu.length : 0;
  document.getElementById('verifyMsg').textContent =
    `出力件数: 現行=${legCount}件 / A=${reuCount}件${rOff ? ' / B='+rOff.length+'件' : ''} (期待値: ${BLEND_MODES.length}件)`;

  const sLeg = stats(timesLeg);
  const sReu = stats(timesReu);
  const sOff = timesOff ? stats(timesOff) : null;

  const avgs = [sLeg.avg, sReu.avg];
  if (sOff) avgs.push(sOff.avg);
  const bestAvg = Math.min(...avgs);

  renderRow('現行実装（毎回Canvas生成）', sLeg, null, sLeg.avg === bestAvg);
  renderRow('改善案A: Canvas1枚を再利用', sReu, sLeg.avg, sReu.avg === bestAvg);
  if (sOff) {
    renderRow('改善案B: OffscreenCanvas + putImageData', sOff, sLeg.avg, sOff.avg === bestAvg);
  } else {
    renderErrorRow('改善案B: OffscreenCanvas + putImageData', offErr);
  }

  this.disabled = false;
});
</script>
</body>
</html>
