<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Bench 01 — SHA-256 ハッシュ比較</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',sans-serif;padding:24px;min-height:100vh}
h1{font-size:20px;margin-bottom:6px;color:#4af}
.subtitle{font-size:13px;color:#888;margin-bottom:20px}
.card{background:#16213e;border:1px solid #1a2a50;border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;color:#adf;margin-bottom:10px}
button{
  background:#2a4a8a;color:#e0e0e0;border:none;border-radius:5px;
  padding:10px 22px;font-size:14px;cursor:pointer;transition:background .2s;
}
button:hover{background:#3a5aaa}
button:disabled{background:#333;color:#666;cursor:not-allowed}
.progress{margin-top:12px;font-size:13px;color:#aaa;min-height:18px}
.progress-bar-wrap{background:#0d1526;border-radius:4px;height:8px;margin-top:6px;overflow:hidden}
.progress-bar{height:100%;background:#4af;width:0%;transition:width .15s}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
th{background:#0d1526;padding:8px 10px;text-align:left;color:#8bf;border-bottom:2px solid #1a2a50}
td{padding:7px 10px;border-bottom:1px solid #1a2a50;vertical-align:middle}
tr:last-child td{border-bottom:none}
.tag-best{display:inline-block;background:#1a4a1a;color:#4f4;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px}
.tag-worst{display:inline-block;background:#4a1a1a;color:#f44;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px}
.hidden{display:none}
.result-wrap{margin-top:0}
.speedup{color:#fd4;font-weight:bold}
.warn{color:#fa4;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>Bench 01 — SHA-256 ハッシュ速度比較</h1>
<p class="subtitle">CryptoJS.SHA256 vs crypto.subtle.digest — 2MB ランダム文字列、10回平均</p>

<div class="card">
  <h2>テスト設定</h2>
  <p style="font-size:13px;color:#aaa">データサイズ: 2MB のランダム文字列 &nbsp;|&nbsp; 繰り返し: 10回</p>
  <p class="warn">※ CryptoJS は CDN (cloudflare) から読み込みます。ネットワーク接続が必要です。</p>
  <div style="margin-top:12px">
    <button id="btnRun">ベンチマーク開始</button>
  </div>
  <div class="progress" id="progress">待機中...</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="pbar"></div></div>
</div>

<div class="card result-wrap" id="resultCard">
  <h2>結果</h2>
  <table id="resultTable">
    <thead>
      <tr>
        <th>手法</th>
        <th>最小 (ms)</th>
        <th>最大 (ms)</th>
        <th>平均 (ms)</th>
        <th>速度比</th>
        <th>ステータス</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<!-- CryptoJS CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
'use strict';

const REPEAT = 10;
const DATA_SIZE = 2 * 1024 * 1024; // 2MB

function setProgress(msg, pct) {
  document.getElementById('progress').textContent = msg;
  document.getElementById('pbar').style.width = pct + '%';
}

function genLargeString(size) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const arr = new Uint8Array(size);
  const chunk = 65536;
  for (let offset = 0; offset < size; offset += chunk) {
    const len = Math.min(chunk, size - offset);
    crypto.getRandomValues(arr.subarray(offset, offset + len));
  }
  const parts = [];
  for (let i = 0; i < size; i += 8192) {
    let seg = '';
    const end = Math.min(i + 8192, size);
    for (let j = i; j < end; j++) {
      seg += chars[arr[j] & 63];
    }
    parts.push(seg);
  }
  return parts.join('');
}

async function benchCryptoJS(str) {
  const times = [];
  for (let i = 0; i < REPEAT; i++) {
    const t0 = performance.now();
    CryptoJS.SHA256(str).toString();
    times.push(performance.now() - t0);
  }
  return times;
}

async function benchSubtle(buf) {
  const times = [];
  for (let i = 0; i < REPEAT; i++) {
    const t0 = performance.now();
    await crypto.subtle.digest('SHA-256', buf);
    times.push(performance.now() - t0);
  }
  return times;
}

function stats(times) {
  const min = Math.min(...times);
  const max = Math.max(...times);
  const avg = times.reduce((a, b) => a + b, 0) / times.length;
  return { min, max, avg };
}

function renderTable(rows) {
  const minAvg = Math.min(...rows.map(r => r.avg));
  const maxAvg = Math.max(...rows.map(r => r.avg));
  const tbody = document.getElementById('resultBody');
  tbody.innerHTML = '';
  rows.forEach(r => {
    const ratio = (r.avg / minAvg).toFixed(2);
    const isBest = Math.abs(r.avg - minAvg) < 0.01;
    const isWorst = Math.abs(r.avg - maxAvg) < 0.01 && rows.length > 1;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.label}</td>
      <td>${r.min.toFixed(2)}</td>
      <td>${r.max.toFixed(2)}</td>
      <td>${r.avg.toFixed(2)}</td>
      <td class="speedup">${ratio}x</td>
      <td>
        ${isBest ? '<span class="tag-best">BEST</span>' : ''}
        ${isWorst ? '<span class="tag-worst">SLOW</span>' : ''}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('btnRun').addEventListener('click', async () => {
  const btn = document.getElementById('btnRun');
  btn.disabled = true;

  try {
    setProgress('テストデータ生成中...', 5);
    await new Promise(r => setTimeout(r, 20));

    const largeStr = genLargeString(DATA_SIZE);
    const enc = new TextEncoder();
    const buf = enc.encode(largeStr);

    setProgress('CryptoJS.SHA256 計測中...', 20);
    await new Promise(r => setTimeout(r, 20));

    let cryptoJSTimes;
    if (typeof CryptoJS !== 'undefined') {
      cryptoJSTimes = await benchCryptoJS(largeStr);
    } else {
      cryptoJSTimes = null;
    }

    setProgress('crypto.subtle.digest 計測中...', 60);
    await new Promise(r => setTimeout(r, 20));

    const subtleTimes = await benchSubtle(buf);

    setProgress('結果集計中...', 95);
    await new Promise(r => setTimeout(r, 20));

    const rows = [];
    if (cryptoJSTimes) {
      rows.push({ label: '現行: CryptoJS.SHA256', ...stats(cryptoJSTimes) });
    } else {
      rows.push({ label: '現行: CryptoJS.SHA256 (CDN未取得)', min: NaN, max: NaN, avg: NaN });
    }
    rows.push({ label: '改善案A: crypto.subtle.digest', ...stats(subtleTimes) });

    renderTable(rows);
    setProgress('完了', 100);
  } catch (e) {
    setProgress('エラー: ' + e.message, 0);
    console.error(e);
  } finally {
    btn.disabled = false;
  }
});

// 自動実行
window.addEventListener('load', () => {
  // CryptoJS のロード待ち
  setTimeout(() => document.getElementById('btnRun').click(), 500);
});
</script>
</body>
</html>
