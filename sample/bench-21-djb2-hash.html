<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Bench 21 — DJB2 ハッシュ比較</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',sans-serif;padding:24px;min-height:100vh}
h1{font-size:20px;margin-bottom:6px;color:#4af}
.subtitle{font-size:13px;color:#888;margin-bottom:20px}
.card{background:#16213e;border:1px solid #1a2a50;border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;color:#adf;margin-bottom:10px}
button{
  background:#2a4a8a;color:#e0e0e0;border:none;border-radius:5px;
  padding:10px 22px;font-size:14px;cursor:pointer;transition:background .2s;
}
button:hover{background:#3a5aaa}
button:disabled{background:#333;color:#666;cursor:not-allowed}
.progress{margin-top:12px;font-size:13px;color:#aaa;min-height:18px}
.progress-bar-wrap{background:#0d1526;border-radius:4px;height:8px;margin-top:6px;overflow:hidden}
.progress-bar{height:100%;background:#4af;width:0%;transition:width .15s}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
th{background:#0d1526;padding:8px 10px;text-align:left;color:#8bf;border-bottom:2px solid #1a2a50}
td{padding:7px 10px;border-bottom:1px solid #1a2a50;vertical-align:middle}
tr:last-child td{border-bottom:none}
.tag-best{display:inline-block;background:#1a4a1a;color:#4f4;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px}
.tag-worst{display:inline-block;background:#4a1a1a;color:#f44;border-radius:3px;padding:1px 6px;font-size:11px;margin-left:6px}
.speedup{color:#fd4;font-weight:bold}
.improve{color:#4f4;font-weight:bold}
.desc{font-size:12px;color:#888;margin-top:6px;line-height:1.6}
</style>
</head>
<body>
<h1>Bench 21 — DJB2 ハッシュ計算速度比較</h1>
<p class="subtitle">現行実装 vs TextEncoder方式 vs チャンク分割方式 — 2MB 文字列、20回平均</p>

<div class="card">
  <h2>テスト設定</h2>
  <p style="font-size:13px;color:#aaa">データサイズ: 2MB のランダム文字列 &nbsp;|&nbsp; 繰り返し: 20回</p>
  <p class="desc">
    現行: 1文字ずつ charCodeAt() で処理<br>
    改善案A: TextEncoder で Uint8Array 変換後バイト単位処理<br>
    改善案B: 4文字ずつチャンク分割処理（ループ回数削減）
  </p>
  <div style="margin-top:12px">
    <button id="btnRun">ベンチマーク開始</button>
  </div>
  <div class="progress" id="progress">待機中...</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="pbar"></div></div>
</div>

<div class="card">
  <h2>結果</h2>
  <table id="resultTable">
    <thead>
      <tr>
        <th>手法</th>
        <th>最小 (ms)</th>
        <th>最大 (ms)</th>
        <th>平均 (ms)</th>
        <th>速度比</th>
        <th>改善率</th>
        <th>ステータス</th>
      </tr>
    </thead>
    <tbody id="resultBody">
      <tr><td colspan="7" style="color:#666;text-align:center;padding:20px">ベンチマーク開始ボタンを押してください</td></tr>
    </tbody>
  </table>
</div>

<script>
'use strict';

const REPEAT = 20;
const DATA_SIZE = 2 * 1024 * 1024; // 2MB

function setProgress(msg, pct) {
  document.getElementById('progress').textContent = msg;
  document.getElementById('pbar').style.width = pct + '%';
}

function genLargeString(size) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const arr = new Uint8Array(size);
  for (let o = 0; o < size; o += 65536) crypto.getRandomValues(arr.subarray(o, Math.min(o + 65536, size)));
  let s = '';
  for (let i = 0; i < size; i++) {
    s += chars[arr[i] & 63];
  }
  return s;
}

// 現行実装
function djb2Hash(str) {
  var h = 5381;
  for (var i = 0, len = str.length; i < len; i++) {
    h = ((h << 5) + h) + str.charCodeAt(i);
    h |= 0;
  }
  return h + ':' + str.length;
}

// 改善案A: TextEncoder + Uint8Array バイト単位処理
const _encoder = new TextEncoder();
function djb2HashTextEncoder(str) {
  var bytes = _encoder.encode(str);
  var h = 5381;
  for (var i = 0, len = bytes.length; i < len; i++) {
    h = ((h << 5) + h) + bytes[i];
    h |= 0;
  }
  return h + ':' + str.length;
}

// 改善案B: 4文字ずつチャンク分割処理
function djb2HashChunked(str) {
  var h = 5381;
  var len = str.length;
  var i = 0;
  // 4文字ずつ処理（ループオーバーヘッド削減）
  var limit = len - 3;
  for (; i < limit; i += 4) {
    h = ((h << 5) + h) + str.charCodeAt(i);     h |= 0;
    h = ((h << 5) + h) + str.charCodeAt(i + 1); h |= 0;
    h = ((h << 5) + h) + str.charCodeAt(i + 2); h |= 0;
    h = ((h << 5) + h) + str.charCodeAt(i + 3); h |= 0;
  }
  // 残り
  for (; i < len; i++) {
    h = ((h << 5) + h) + str.charCodeAt(i);
    h |= 0;
  }
  return h + ':' + str.length;
}

function stats(times) {
  const min = Math.min(...times);
  const max = Math.max(...times);
  const avg = times.reduce((a, b) => a + b, 0) / times.length;
  return { min, max, avg };
}

function renderTable(rows) {
  const baselineAvg = rows[0].avg;
  const minAvg = Math.min(...rows.map(r => r.avg));
  const maxAvg = Math.max(...rows.map(r => r.avg));
  const tbody = document.getElementById('resultBody');
  tbody.innerHTML = '';
  rows.forEach(r => {
    const ratio = (r.avg / minAvg).toFixed(2);
    const improveRate = ((1 - r.avg / baselineAvg) * 100).toFixed(1);
    const isBest = Math.abs(r.avg - minAvg) < 0.01;
    const isWorst = Math.abs(r.avg - maxAvg) < 0.01 && rows.length > 1;
    const isBaseline = rows.indexOf(r) === 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.label}</td>
      <td>${r.min.toFixed(2)}</td>
      <td>${r.max.toFixed(2)}</td>
      <td>${r.avg.toFixed(2)}</td>
      <td class="speedup">${ratio}x</td>
      <td class="${isBaseline ? '' : (parseFloat(improveRate) > 0 ? 'improve' : 'speedup')}">${isBaseline ? '(基準)' : (parseFloat(improveRate) > 0 ? '+' + improveRate + '%' : improveRate + '%')}</td>
      <td>
        ${isBest ? '<span class="tag-best">BEST</span>' : ''}
        ${isWorst ? '<span class="tag-worst">SLOW</span>' : ''}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function runBench() {
  const btn = document.getElementById('btnRun');
  btn.disabled = true;

  try {
    setProgress('テストデータ生成中... (2MB)', 5);
    await new Promise(r => setTimeout(r, 20));
    const largeStr = genLargeString(DATA_SIZE);

    // 現行
    setProgress('現行実装 計測中... (1/3)', 15);
    await new Promise(r => setTimeout(r, 20));
    const timesCurrent = [];
    for (let i = 0; i < REPEAT; i++) {
      const t0 = performance.now();
      djb2Hash(largeStr);
      timesCurrent.push(performance.now() - t0);
      if (i % 5 === 4) {
        setProgress(`現行実装 計測中... ${i + 1}/${REPEAT}`, 15 + (i + 1) / REPEAT * 25);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    // 改善案A
    setProgress('改善案A (TextEncoder) 計測中... (2/3)', 40);
    await new Promise(r => setTimeout(r, 20));
    const timesA = [];
    for (let i = 0; i < REPEAT; i++) {
      const t0 = performance.now();
      djb2HashTextEncoder(largeStr);
      timesA.push(performance.now() - t0);
      if (i % 5 === 4) {
        setProgress(`改善案A 計測中... ${i + 1}/${REPEAT}`, 40 + (i + 1) / REPEAT * 25);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    // 改善案B
    setProgress('改善案B (チャンク分割) 計測中... (3/3)', 65);
    await new Promise(r => setTimeout(r, 20));
    const timesB = [];
    for (let i = 0; i < REPEAT; i++) {
      const t0 = performance.now();
      djb2HashChunked(largeStr);
      timesB.push(performance.now() - t0);
      if (i % 5 === 4) {
        setProgress(`改善案B 計測中... ${i + 1}/${REPEAT}`, 65 + (i + 1) / REPEAT * 25);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    setProgress('結果集計中...', 95);
    await new Promise(r => setTimeout(r, 20));

    const rows = [
      { label: '現行: charCodeAt 1文字ずつ', ...stats(timesCurrent) },
      { label: '改善案A: TextEncoder + Uint8Array', ...stats(timesA) },
      { label: '改善案B: 4文字チャンク分割', ...stats(timesB) },
    ];
    renderTable(rows);
    setProgress('完了', 100);
  } catch (e) {
    setProgress('エラー: ' + e.message, 0);
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('btnRun').addEventListener('click', runBench);

// 自動実行
window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('btnRun').click(), 200);
});
</script>
</body>
</html>
